<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-cloud-sun"></i> Find Weather</h1>

    <form method="POST">
      <input type="text" name="city" placeholder="Enter Country Name" required>
      <button type="submit">Check Weather</button>
    </form>

    {% if weather %}
      {% if weather.error %}
        <p class="error">{{ weather.error }}</p>
      {% else %}
        <div class="result">
          <div class="info-card">
           <img src="/static/image/icon3.jpg" alt="Temperature Icon" class="icon">
            <h2>{{ weather.city }}</h2>
          </div>

          <div class="info-card">
           <img src="/static/image/icon1.jpg" alt="Temperature Icon" class="icon">
            <p><strong>Temperature:</strong> {{ weather.temperature }}</p>
          </div>

          <div class="info-card">
            <img src="/static/image/icon2.jpg" alt="Temperature Icon" class="icon">
            <p><strong>Condition:</strong> {{ weather.description }}</p>
          </div>
        </div>
      {% endif %}
    {% endif %}
  </div>
</body>
</html>
